<!DOCTYPE html>
<html>
<head>
  <title>Creative Character Cards</title>
  <link rel="stylesheet" href="creative-cards.css">
</head>
<body>

  <header>
    <h1>Creative Character Cards</h1>
    <p>Meet my favorite characters from games and stories.</p>
  </header>

  <button onclick="document.body.style.backgroundColor='lightyellow'">
    Change Background
  </button>

  <main class="card-container">
    <section class="card">
      <div class="card-icon">🐉</div>
      <h2>Fire Dragon</h2>
      <p>A powerful dragon that guards the mountain castle.</p>
      <p><strong>Power:</strong> Fire Breath</p>
      <button onclick="alert('You selected the Fire Dragon!')">
        Choose Dragon
      </button>
    </section>

    <section class="card">
      <div class="card-icon">🧙</div>
      <h2>Wise Wizard</h2>
      <p>A clever wizard who uses ancient spells.</p>
      <p><strong>Power:</strong> Magic Shield</p>
      <button onclick="alert('You selected the Wise Wizard!')">
        Choose Wizard
      </button>
    </section>
  </main>

</body>
</html>
